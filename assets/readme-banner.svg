<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#A97BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A97BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3DF5FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3DF5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="75%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#FF4FCB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF4FCB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DF5FF"/>
      <stop offset="50%" stop-color="#A97BFF"/>
      <stop offset="100%" stop-color="#FF4FCB"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DF5FF"/>
      <stop offset="50%" stop-color="#A97BFF"/>
      <stop offset="100%" stop-color="#FFC15E"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0A0D18"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>
  <rect width="1200" height="320" fill="url(#glow3)"/>

  <!-- scattered stars -->
  <g fill="#C8D4FF" opacity="0.5">
    <circle cx="80" cy="40" r="1.4"/><circle cx="150" cy="90" r="1"/><circle cx="1080" cy="50" r="1.6"/>
    <circle cx="1140" cy="120" r="1.1"/><circle cx="60" cy="220" r="1.2"/><circle cx="1110" cy="250" r="1.3"/>
    <circle cx="980" cy="30" r="1"/><circle cx="40" cy="150" r="1.4"/><circle cx="1160" cy="200" r="1"/>
  </g>

  <!-- orbit rings (decorative, echoes the dashboard's day-arc motif) -->
  <g transform="translate(970,160)" opacity="0.9">
    <circle r="92" fill="none" stroke="#232a4d" stroke-width="14"/>
    <circle r="92" fill="none" stroke="url(#ringGrad)" stroke-width="14"
            stroke-dasharray="330 578" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="5" fill="#3DF5FF" filter="url(#softBlur)" opacity="0.8"/>
    <circle r="5" fill="#3DF5FF"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(90,110)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#logoGrad)"/>
    <circle cx="50" cy="50" r="17" fill="#0A0D18"/>
  </g>

  <!-- wordmark -->
  <text x="215" y="150" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#EAF0FF">Orbit</text>
  <text x="215" y="188" font-family="'Segoe UI', sans-serif" font-size="20" letter-spacing="2" fill="#8792B0">DAILY&#160;&#160;PLANNER</text>

  <!-- tagline -->
  <text x="217" y="235" font-family="'Segoe UI', sans-serif" font-size="18" fill="#B9C2E6">Plan your days. Track your trends. Reflect on it all.</text>
</svg>
